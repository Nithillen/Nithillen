<svg xmlns="http://www.w3.org/2000/svg" width="293.333" height="212" viewBox="0 0 293.333 212" role="img" aria-label="readmission_engine - CLINICAL ML &amp; SQL">
<title>readmission_engine - CLINICAL ML &amp; SQL</title>
<style>
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to { opacity: 1; transform: none; }
}
@keyframes fade {
  from { opacity: 0; }
  to { opacity: 1; }
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.35; transform: scale(0.85); }
}
@keyframes shine {
  0% { transform: translateX(-600px); }
  40%, 100% { transform: translateX(900px); }
}
@keyframes sheen {
  0% { transform: translateX(-300px) skewX(-20deg); }
  25%, 100% { transform: translateX(500px) skewX(-20deg); }
}
@keyframes nudge {
  0%, 100% { transform: none; }
  50% { transform: translate(3px, -3px); }
}
.r { opacity: 0; animation: rise 0.8s cubic-bezier(0.16, 1, 0.3, 1) both; transform-box: fill-box; }
.f { opacity: 0; animation: fade 0.9s ease-out both; }
.live { animation: pulse 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.nu { transform-box: fill-box; animation: nudge 2s ease-in-out infinite; }
.sh { animation: sheen 6s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .r, .f, .live, .nu, .sh { animation: none !important; opacity: 1 !important; transform: none !important; }
}
</style>
<g transform="translate(4.000, 0)">
<defs>
  <linearGradient id="repo-bg-1" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0c1220"/>
    <stop offset="100%" stop-color="#080c16"/>
  </linearGradient>
</defs>

<!-- Card Surface -->
<rect width="285.333" height="200" rx="12" fill="url(#repo-bg-1)"/>
<rect width="285.333" height="200" rx="12" fill="none" stroke="#1e293b" stroke-width="1"/>

<!-- Header: Tag & Language -->
<g class="r" style="animation-delay: 0.62s">
  <rect x="20" y="20" width="6" height="6" rx="1.5" fill="#10b981"/>
  <text x="32" y="26" font-family="'SF Mono', Monaco, Consolas, 'Liberation Mono', Menlo, monospace" font-size="10.5" letter-spacing="1" fill="#10b981">CLINICAL ML &amp; SQL</text>
  <text class="nu" x="257.3333333333333" y="26" font-family="'SF Mono', Monaco, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#64748b">↗</text>
</g>

<!-- Repository Title -->
<g class="r" style="animation-delay: 0.77s">
  <text x="20" y="58" font-family="'SF Mono', Monaco, Consolas, 'Liberation Mono', Menlo, monospace" font-size="15" font-weight="600" fill="#f8fafc">readmission_engine</text>
</g>

<!-- Description Lines -->
<text class="r" style="animation-delay: 0.92s" x="20" y="86" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a8b8">MIMIC-III clinical wrangling via</text><text class="r" style="animation-delay: 1.00s" x="20" y="105" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a8b8">CTEs &amp; LEAD(). Random Forest</text><text class="r" style="animation-delay: 1.08s" x="20" y="124" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" fill="#94a8b8">with SHAP stakeholder reporting.</text>

<!-- Tech Stack Pill at Bottom -->
<g class="f" style="animation-delay: 1.22s">
  <line x1="20" y1="162" x2="265.3333333333333" y2="162" stroke="#1e293b" stroke-width="1"/>
  <text x="20" y="182" font-family="'SF Mono', Monaco, Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" fill="#64748b">Python · SQL · Scikit-Learn · SHAP</text>
</g>
